<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Training</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; padding: 0 24px 60px;
      max-width: 1100px; margin: 0 auto;
    }

    .main-nav {
      position: sticky; top: 0; z-index: 60;
      background: #0f1117cc; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e2430;
      display: flex; align-items: center; gap: 0;
      margin: 0 -24px; padding: 0 24px;
    }
    .main-nav a {
      padding: 14px 20px; font-size: .88rem; font-weight: 600;
      color: #64748b; text-decoration: none; white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .main-nav a:hover { color: #cbd5e1; }
    .main-nav a.active { color: #a5b4fc; border-bottom-color: #6366f1; }

    .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-top: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: #64748b; font-size: .85rem; margin-top: 2px; }

    #error-msg { color: #fca5a5; font-size: .95rem; padding: 40px 0; text-align: center; }

    .summary-card {
      background: #111827; border: 1px solid #1e2030; border-radius: 12px;
      padding: 18px 20px; margin-bottom: 24px;
    }
    .summary-card h3 { font-size: .82rem; color: #cbd5e1; margin-bottom: 10px; }
    .summary-row { display: flex; justify-content: space-between; font-size: .8rem; color: #94a3b8; padding: 4px 0; }
    .summary-row span:last-child { color: #e2e8f0; font-weight: 600; }

    .section-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #475569; margin: 36px 0 14px;
      padding-bottom: 8px; border-bottom: 1px solid #1e2430;
    }

    .btn {
      background: #4f46e5; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #4338ca; }
    .btn:disabled { background: #2d3748; cursor: not-allowed; }

    .model-table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 10px; overflow: hidden; border: 1px solid #1e2030; font-size: .78rem; }
    .model-table th, .model-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #1e2430; white-space: nowrap; }
    .model-table th { color: #64748b; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
    .model-table tr:last-child td { border-bottom: none; }
    .model-name { font-weight: 600; color: #e2e8f0; }
    .metric-error { color: #fca5a5; font-size: .74rem; white-space: normal; }
    .best-row { background: #0d1f17; }
    .top3-row { background: #1e1b4b33; }
    .best-badge { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 999px; background: #064e3b; color: #6ee7b7; margin-left: 6px; }
    .top3-badge { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 999px; background: #312e81; color: #c7d2fe; margin-left: 6px; }

    .note { color: #64748b; font-size: .8rem; margin-bottom: 10px; }
    .table-wrap { overflow-x: auto; }

    .next-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e1b4b; border: 1px solid #312e81; border-radius: 10px;
      padding: 12px 18px; margin-top: 28px; gap: 12px;
      text-decoration: none; transition: background .15s, border-color .15s;
    }
    .next-banner:hover { background: #252159; border-color: #4338ca; }
    .next-banner-text { font-size: .88rem; color: #c7d2fe; }
    .next-banner-text strong { color: #e0e7ff; }
    .next-banner-arrow { color: #6366f1; font-size: 1.1rem; flex-shrink: 0; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <nav class="main-nav">
    <a href="/">Data Collection</a>
    <a href="/analysis">Data Exploration</a>
    <a href="/preparation">Data Preparation</a>
    <a href="/training" class="active">Data Training</a>
    <a href="/hyperparameter">Hyperparameter Search</a>
    <a href="/inference">Inference</a>
  </nav>
  <div id="res-bar" style="
    font-size:.72rem;font-weight:600;color:#64748b;
    display:flex;align-items:center;flex-wrap:wrap;gap:14px;
    padding:6px 0 0;margin-bottom:4px;
  "></div>
  <script>
    (function(){
      const bar = document.getElementById('res-bar');
      function pill(label,pct,color){
        return `<span style="display:inline-flex;align-items:center;gap:6px">
          <span style="color:#94a3b8">${label}</span>
          <span style="background:#1e2430;border-radius:999px;overflow:hidden;width:64px;height:7px;display:inline-block">
            <span style="display:block;height:100%;width:${Math.min(pct,100)}%;background:${color};border-radius:999px;transition:width .4s"></span>
          </span>
          <span style="color:#cbd5e1">${pct}%</span>
        </span>`;
      }
      async function refresh(){
        try{
          const d = await fetch('/resources').then(r=>r.json());
          let html = '';
          html += pill('CPU', d.cpu_pct, '#6366f1');
          if(d.ram && d.ram.total_mb){
            html += pill(`RAM ${d.ram.used_mb}/${d.ram.total_mb} MB`, d.ram.percent, '#0ea5e9');
          }
          bar.innerHTML = html;
        }catch(e){ bar.innerHTML = ''; }
      }
      refresh();
      setInterval(refresh, 5000);
    })();
  </script>

  <div class="top-bar">
    <div>
      <h1>Data Training</h1>
      <div class="subtitle">AutoML (PyCaret) model scouting: compare candidate models on a 10% sample to see which are worth tuning.</div>
    </div>
  </div>

  <div id="content"></div>

  <script>
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function safeJSON(str) { try { return JSON.parse(str); } catch { return null; } }

    const MODEL_LABELS = {
      lr: 'Linear/Logistic Regression', knn: 'KNN', nb: 'Naive Bayes', dt: 'Decision Tree',
      svm: 'SVM', ridge: 'Ridge', rf: 'Random Forest', qda: 'QDA',
      ada: 'AdaBoost', gbc: 'Gradient Boosting', gbr: 'Gradient Boosting', lda: 'LDA', et: 'Extra Trees',
      lightgbm: 'LightGBM', catboost: 'CatBoost', dummy: 'Dummy (baseline)',
      lasso: 'Lasso', en: 'Elastic Net', lar: 'Least Angle Regression', llar: 'Lasso Least Angle Regression',
      omp: 'Orthogonal Matching Pursuit', br: 'Bayesian Ridge', par: 'Passive Aggressive', huber: 'Huber',
    };
    function metricKeysFor(taskType) {
      return taskType === 'categorical'
        ? [['Accuracy','Accuracy'],['AUC','AUC'],['Recall','Recall'],['Prec.','Prec.'],['F1','F1'],['Kappa','Kappa'],['MCC','MCC']]
        : [['MAE','MAE'],['MSE','MSE'],['RMSE','RMSE'],['R2','R2'],['RMSLE','RMSLE'],['MAPE','MAPE']];
    }

    // Ranking cascade per task: only falls back to the next metric when every
    // metric before it is tied — mirrors automl_worker.py's _rank_tuple so the
    // "best" row highlighted here matches what actually gets picked as top 3.
    const RANK_METRICS = {
      categorical: ['Accuracy', 'F1', 'MCC', 'Kappa', 'AUC'],
      numeric: ['R2', 'RMSE', 'MAE', 'MSE'],
    };
    const LOWER_IS_BETTER = new Set(['RMSE', 'MAE', 'MSE', 'RMSLE', 'MAPE']);
    function rankTuple(metrics, taskType) {
      return RANK_METRICS[taskType].map(k => {
        const v = parseFloat(metrics[k]);
        const val = isNaN(v) ? 0 : v;
        return LOWER_IS_BETTER.has(k) ? -val : val;
      });
    }
    function tupleGreater(a, b) {
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return a[i] > b[i];
      }
      return false;
    }

    const content = document.getElementById('content');
    const raw = sessionStorage.getItem('preparedData');

    if (!raw) {
      content.innerHTML = `<div id="error-msg">
        No prepared dataset found. <a class="download-link" href="/preparation" style="color:#a5b4fc">Go run Data Preparation first</a>.
      </div>`;
    } else {
      const data = JSON.parse(raw);
      const label = data.columns[data.columns.length - 1];
      const isCategorical = Object.prototype.hasOwnProperty.call(data.encoding_info || {}, label);
      const labelKind = isCategorical ? 'categorical' : 'numeric';

      if (!data.clean_file_id) {
        content.innerHTML = `<div id="error-msg">
          No clean (imputed) dataset available from Data Preparation. Training needs unencoded features.
          <br><a href="/preparation" style="color:#a5b4fc">&larr; Go re-run Data Preparation</a>
        </div>`;
      } else {
        renderApp(data, label, labelKind);
      }
    }

    function renderApp(data, label, labelKind) {
      const taskLabel = labelKind === 'categorical' ? 'classification' : 'regression';
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <h3>Dataset</h3>
        <div class="summary-row"><span>Rows</span><span>${data.row_count}</span></div>
        <div class="summary-row"><span>Label</span><span>${escHtml(label)} (${taskLabel})</span></div>
        <div class="summary-row"><span>Sample for comparison</span><span>10% ${labelKind === 'categorical' ? '(stratified)' : ''}</span></div>`;
      content.appendChild(card);

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Compare models';
      content.appendChild(title);

      const runBtn = document.createElement('button');
      runBtn.className = 'btn';
      runBtn.textContent = 'Run comparison';
      content.appendChild(runBtn);

      const resultsHost = document.createElement('div');
      content.appendChild(resultsHost);

      runBtn.addEventListener('click', () => runTraining(data, label, labelKind, runBtn, resultsHost));
    }

    function runTraining(data, label, labelKind, runBtn, resultsHost) {
      runBtn.disabled = true;
      runBtn.textContent = 'Running…';
      resultsHost.innerHTML = '';
      let es = null;

      function done() {
        if (es) { es.close(); es = null; }
        runBtn.disabled = false;
        runBtn.textContent = 'Run comparison';
      }
      function showError(msg) {
        done();
        resultsHost.innerHTML += `<div id="error-msg" style="padding:20px 0">${escHtml(msg)}</div>`;
      }

      (async () => {
        let jobId;
        try {
          const init = await fetch('/train/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              clean_file_id: data.clean_file_id,
              columns: data.columns,
              label,
              label_kind: labelKind,
              sample_frac: 0.1,
            }),
          });
          if (!init.ok) {
            const err = await init.json().catch(() => ({}));
            showError(err.detail || `Request failed (${init.status})`);
            return;
          }
          ({ job_id: jobId } = await init.json());
        } catch (e) {
          showError(e.message);
          return;
        }

        es = new EventSource(`/train/stream/${jobId}`);
        let top3Models = [];
        let compareResults = {};

        es.addEventListener('error', (e) => {
          const d = safeJSON(e.data);
          showError(d ? d.detail : 'Stream error');
        });
        es.addEventListener('sample_ready', (e) => {
          const d = safeJSON(e.data);
          if (d) renderSampleNote(resultsHost, d, labelKind);
        });
        es.addEventListener('compare_start', (e) => {
          const d = safeJSON(e.data);
          if (d) renderCompareSkeleton(resultsHost, d.models, labelKind);
        });
        es.addEventListener('compare_result', (e) => {
          const d = safeJSON(e.data);
          if (d) {
            compareResults[d.model] = d.error ? { error: d.error } : d.metrics;
            setCompareResult(d, labelKind);
          }
        });
        es.addEventListener('leaderboard_done', (e) => {
          const d = safeJSON(e.data);
          if (d) { top3Models = d.top3; markTop3(d.top3); }
        });
        es.addEventListener('done', () => {
          sessionStorage.setItem('trainingData', JSON.stringify({
            clean_file_id: data.clean_file_id,
            columns: data.columns,
            label,
            label_kind: labelKind,
            top3: top3Models,
            compare_results: compareResults,
          }));
          renderNextBanner(resultsHost);
          done();
        });
        es.onerror = () => {
          if (es && es.readyState === EventSource.CLOSED) {
            showError('Connection lost during comparison.');
          }
        };
      })();
    }

    function renderSampleNote(host, d, labelKind) {
      const note = document.createElement('div');
      note.className = 'note';
      const sampling = labelKind === 'categorical' ? 'stratified sample' : 'random sample';
      note.textContent = `Comparing models on ${d.n_sample.toLocaleString()} rows (${Math.round(d.sample_frac*100)}% ${sampling} of ${d.n_total.toLocaleString()} total rows)…`;
      host.appendChild(note);
    }

    function metricCells(prefix, taskType) {
      return metricKeysFor(taskType).map(([k]) => `<td id="${prefix}-${cssKey(k)}"><span style="color:#334155">waiting…</span></td>`).join('');
    }
    function cssKey(k) { return k.replace('.', ''); }

    function renderCompareSkeleton(host, models, labelKind) {
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Model comparison — 10% sample';
      host.appendChild(title);

      const keys = metricKeysFor(labelKind);
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      table.className = 'model-table';
      table.id = 'compare-table';
      table.dataset.labelKind = labelKind;
      table.innerHTML = `<thead><tr><th>Model</th><th>Time</th>${keys.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>`;
      const tbody = document.createElement('tbody');
      models.forEach(name => {
        const tr = document.createElement('tr');
        tr.id = `crow-${name}`;
        tr.innerHTML = `<td class="model-name" id="cname-${name}">${MODEL_LABELS[name]||name}</td>
          <td id="ctime-${name}" style="color:#64748b">—</td>
          ${metricCells(`ccell-${name}`, labelKind)}`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      host.appendChild(wrap);
    }

    function setCompareResult(d, labelKind) {
      const keys = metricKeysFor(labelKind);
      const timeCell = document.getElementById(`ctime-${d.model}`);
      if (timeCell) timeCell.textContent = `${d.elapsed_s}s`;
      if (d.error) {
        keys.forEach(([k]) => {
          const cell = document.getElementById(`ccell-${d.model}-${cssKey(k)}`);
          if (cell) cell.innerHTML = `<span class="metric-error">${escHtml(d.error)}</span>`;
        });
        return;
      }
      keys.forEach(([k]) => {
        const cell = document.getElementById(`ccell-${d.model}-${cssKey(k)}`);
        if (cell) cell.textContent = d.metrics[k] ?? '—';
      });
      // Re-evaluate best row: primary metric first, falling back through the rank
      // cascade only when everything before it ties — not just the single rankKey
      // column, so the highlighted "best" model matches what backend picks as top 3.
      let bestName = null, bestTuple = null;
      document.querySelectorAll('#compare-table [id^="crow-"]').forEach(tr => {
        const name = tr.id.replace('crow-','');
        const rowMetrics = {};
        let hasAny = false;
        RANK_METRICS[labelKind].forEach(k => {
          const cell = document.getElementById(`ccell-${name}-${cssKey(k)}`);
          if (cell && cell.textContent.trim() !== '' && cell.textContent !== '—') {
            rowMetrics[k] = cell.textContent;
            hasAny = true;
          }
        });
        if (!hasAny) return;
        const tuple = rankTuple(rowMetrics, labelKind);
        if (bestTuple === null || tupleGreater(tuple, bestTuple)) { bestTuple = tuple; bestName = name; }
      });
      document.querySelectorAll('#compare-table [id^="crow-"]').forEach(tr => {
        const name = tr.id.replace('crow-','');
        tr.classList.toggle('best-row', name === bestName);
        const nameCell = document.getElementById(`cname-${name}`);
        if (nameCell) nameCell.innerHTML = `${MODEL_LABELS[name]||name}${name === bestName ? '<span class="best-badge">best</span>' : ''}`;
      });
    }

    function markTop3(top3) {
      top3.forEach(name => {
        const tr = document.getElementById(`crow-${name}`);
        if (tr) tr.classList.add('top3-row');
        const nameCell = document.getElementById(`cname-${name}`);
        if (nameCell && !nameCell.innerHTML.includes('top3-badge')) {
          nameCell.innerHTML += '<span class="top3-badge">top 3</span>';
        }
      });
    }

    function renderNextBanner(host) {
      const banner = document.createElement('a');
      banner.className = 'next-banner';
      banner.href = '/hyperparameter';
      banner.innerHTML = `
        <span class="next-banner-text">Next: <strong>Hyperparameter Search</strong></span>
        <span class="next-banner-arrow">&rarr;</span>`;
      host.appendChild(banner);
    }

    // Data Collection resets all progress — confirm before navigating
    document.querySelector('.main-nav a[href="/"]').addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Going to Data Collection will clear all current progress (preparation, training, inference). Continue?')) {
        sessionStorage.clear();
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
