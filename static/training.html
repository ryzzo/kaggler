<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Training</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; padding: 0 24px 60px;
      max-width: 1100px; margin: 0 auto;
    }

    .main-nav {
      position: sticky; top: 0; z-index: 60;
      background: #0f1117cc; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e2430;
      display: flex; align-items: center; gap: 0;
      margin: 0 -24px; padding: 0 24px;
    }
    .main-nav a {
      padding: 14px 20px; font-size: .88rem; font-weight: 600;
      color: #64748b; text-decoration: none; white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .main-nav a:hover { color: #cbd5e1; }
    .main-nav a.active { color: #a5b4fc; border-bottom-color: #6366f1; }

    .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-top: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: #64748b; font-size: .85rem; margin-top: 2px; }

    .placeholder {
      text-align: center; padding: 80px 20px;
      color: #475569; font-size: .95rem;
    }
    .placeholder svg { width: 48px; height: 48px; color: #334155; margin-bottom: 16px; }

    .summary-card {
      background: #111827; border: 1px solid #1e2030; border-radius: 12px;
      padding: 18px 20px; margin-bottom: 24px;
    }
    .summary-card h3 { font-size: .82rem; color: #cbd5e1; margin-bottom: 10px; }
    .summary-row { display: flex; justify-content: space-between; font-size: .8rem; color: #94a3b8; padding: 4px 0; }
    .summary-row span:last-child { color: #e2e8f0; font-weight: 600; }
    .col-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .col-chip { font-size: .72rem; background: #1e1b4b; color: #a5b4fc; padding: 3px 9px; border-radius: 999px; }
    .download-link { color: #a5b4fc; text-decoration: none; font-size: .8rem; font-weight: 600; }
    .download-link:hover { text-decoration: underline; }

    #error-msg { color: #fca5a5; font-size: .95rem; padding: 40px 0; text-align: center; }

    .section-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #475569; margin: 36px 0 14px;
      padding-bottom: 8px; border-bottom: 1px solid #1e2430;
    }

    .task-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    }
    .task-badge.classification { background: #3b1f5e; color: #c4b5fd; }
    .task-badge.regression     { background: #1e3a5f; color: #93c5fd; }

    .btn {
      background: #4f46e5; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #4338ca; }
    .btn:disabled { background: #2d3748; cursor: not-allowed; }

    .model-table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 10px; overflow: hidden; border: 1px solid #1e2030; }
    .model-table th, .model-table td { padding: 10px 14px; text-align: left; font-size: .82rem; border-bottom: 1px solid #1e2430; }
    .model-table th { color: #64748b; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
    .model-table tr:last-child td { border-bottom: none; }
    .model-name { font-weight: 600; color: #e2e8f0; }
    .metric-error { color: #fca5a5; font-size: .78rem; }
    .best-row { background: #0d1f17; }
    .best-badge { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: #064e3b; color: #6ee7b7; margin-left: 8px; }

    .next-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e1b4b; border: 1px solid #312e81; border-radius: 10px;
      padding: 12px 18px; margin-top: 28px; gap: 12px;
      text-decoration: none; transition: background .15s, border-color .15s;
    }
    .next-banner:hover { background: #252159; border-color: #4338ca; }
    .next-banner-text { font-size: .88rem; color: #c7d2fe; }
    .next-banner-text strong { color: #e0e7ff; }
    .next-banner-arrow { color: #6366f1; font-size: 1.1rem; flex-shrink: 0; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <nav class="main-nav">
    <a href="/">Data Collection</a>
    <a href="/analysis">Data Exploration</a>
    <a href="/preparation">Data Preparation</a>
    <a href="/training" class="active">Data Training</a>
    <a href="/inference">Inference</a>
  </nav>
  <div id="res-bar" style="
    font-size:.72rem;font-weight:600;color:#64748b;
    display:flex;align-items:center;flex-wrap:wrap;gap:14px;
    padding:6px 0 0;margin-bottom:4px;
  "></div>
  <script>
    (function(){
      const bar = document.getElementById('res-bar');
      function pill(label,pct,color){
        return `<span style="display:inline-flex;align-items:center;gap:6px">
          <span style="color:#94a3b8">${label}</span>
          <span style="background:#1e2430;border-radius:999px;overflow:hidden;width:64px;height:7px;display:inline-block">
            <span style="display:block;height:100%;width:${Math.min(pct,100)}%;background:${color};border-radius:999px;transition:width .4s"></span>
          </span>
          <span style="color:#cbd5e1">${pct}%</span>
        </span>`;
      }
      async function refresh(){
        try{
          const d = await fetch('/resources').then(r=>r.json());
          let html = '';
          html += pill('CPU', d.cpu_pct, '#6366f1');
          if(d.ram && d.ram.total_mb){
            html += pill(`RAM ${d.ram.used_mb}/${d.ram.total_mb} MB`, d.ram.percent, '#0ea5e9');
          }
          if(d.gpu_available && d.gpu && d.gpu.util_pct != null){
            html += pill(`GPU ${d.gpu.vram_used_mb}/${d.gpu.vram_total_mb} MB`, d.gpu.util_pct, '#10b981');
          } else if(d.gpu_available){
            html += `<span style="color:#475569">GPU: N/A</span>`;
          }
          bar.innerHTML = html;
        }catch(e){ bar.innerHTML = ''; }
      }
      refresh();
      setInterval(refresh, 5000);
    })();
  </script>

  <div class="top-bar">
    <div>
      <h1>Data Training</h1>
      <div class="subtitle">Train and evaluate a model on your prepared data.</div>
    </div>
  </div>

  <div id="content"></div>

  <script>
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const content = document.getElementById('content');
    const raw = sessionStorage.getItem('preparedData');

    if (!raw) {
      content.innerHTML = `<div id="error-msg">
        No prepared dataset found. <a class="download-link" href="/preparation">Go run Data Preparation first</a>.
      </div>`;
    } else {
      const data = JSON.parse(raw);
      const label = data.columns[data.columns.length - 1];
      const isCategorical = Object.prototype.hasOwnProperty.call(data.encoding_info || {}, label);
      const labelKind = isCategorical ? 'categorical' : 'numeric';
      const taskType = isCategorical ? 'classification' : 'regression';

      // Which file to train on — user can switch if clean data is available
      let trainFileId = data.prepared_file_id;
      let trainFileLabel = 'Encoded + scaled (prepared)';

      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <h3>Prepared dataset ready</h3>
        <div class="summary-row"><span>Rows</span><span>${data.row_count}</span></div>
        <div class="summary-row"><span>Columns</span><span>${data.columns.length}</span></div>
        <div class="summary-row"><span>Download</span><span><a class="download-link" href="${data.download_url}" download>prepared_data.csv</a></span></div>
        ${data.clean_download_url ? `<div class="summary-row"><span>Clean data</span><span><a class="download-link" style="color:#6ee7b7" href="${data.clean_download_url}" download>clean_data.csv</a></span></div>` : ''}
        <div class="col-chip-row">${data.columns.map(c => `<span class="col-chip">${escHtml(c)}</span>`).join('')}</div>`;
      content.appendChild(card);

      // Dataset selector — shown only when clean (imputed, original-scale) data exists
      if (data.clean_file_id) {
        const dsTitle = document.createElement('div');
        dsTitle.className = 'section-title';
        dsTitle.textContent = 'Training dataset';
        content.appendChild(dsTitle);

        const dsCard = document.createElement('div');
        dsCard.className = 'summary-card';
        dsCard.style.padding = '12px 16px';

        function makeOption(fileId, labelText, desc, isClean) {
          const opt = document.createElement('label');
          opt.style.cssText = 'display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:8px 0;border-bottom:1px solid #1e2430';
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'train-dataset';
          radio.value = fileId;
          radio.style.cssText = 'margin-top:3px;accent-color:#6366f1;flex-shrink:0';
          if (fileId === trainFileId) radio.checked = true;
          const txt = document.createElement('div');
          txt.innerHTML = `<div style="font-size:.83rem;font-weight:600;color:${isClean ? '#6ee7b7' : '#a5b4fc'}">${labelText}</div>
            <div style="font-size:.75rem;color:#64748b;margin-top:2px">${desc}</div>`;
          opt.appendChild(radio);
          opt.appendChild(txt);
          radio.addEventListener('change', () => {
            trainFileId = fileId;
            trainFileLabel = labelText;
          });
          return opt;
        }

        dsCard.appendChild(makeOption(
          data.prepared_file_id,
          'Encoded + scaled (prepared)',
          'Label-encoded categoricals, z-score scaled numerics. Standard input for tree-based models.',
          false,
        ));
        dsCard.appendChild(makeOption(
          data.clean_file_id,
          'Clean data (imputed, original scale)',
          'Missing values filled via median / mode / KNN — original values kept. Useful if you want the model to learn from unscaled features.',
          true,
        ));
        dsCard.lastChild.style.borderBottom = 'none';
        content.appendChild(dsCard);
      }

      const labelTitle = document.createElement('div');
      labelTitle.className = 'section-title';
      labelTitle.textContent = 'Nature of label';
      content.appendChild(labelTitle);

      const labelCard = document.createElement('div');
      labelCard.className = 'summary-card';
      labelCard.innerHTML = `
        <div class="summary-row">
          <span>Label — ${escHtml(label)}</span>
          <span><span class="task-badge ${taskType}">${labelKind} &rarr; ${taskType}</span></span>
        </div>
        <div class="summary-row" style="margin-top:6px"><span style="color:#64748b">
          ${isCategorical
            ? 'Label was label-encoded from categorical values, so this trains classifiers.'
            : 'Label is numeric (standard-scaled), so this trains regressors.'}
        </span></div>`;
      content.appendChild(labelCard);

      const trainTitle = document.createElement('div');
      trainTitle.className = 'section-title';
      trainTitle.textContent = 'Train models';
      content.appendChild(trainTitle);

      const trainBtn = document.createElement('button');
      trainBtn.className = 'btn';
      trainBtn.textContent = `Train GradientBoosting, LightGBM & CatBoost (${taskType})`;
      content.appendChild(trainBtn);

      // Show GPU badge based on server health
      const gpuBadge = document.createElement('span');
      gpuBadge.style.cssText = 'display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:middle;background:#1e1b4b;color:#a5b4fc';
      gpuBadge.textContent = 'checking GPU…';
      trainBtn.insertAdjacentElement('afterend', gpuBadge);
      fetch('/health').then(r => r.json()).then(h => {
        if (h.gpu) {
          gpuBadge.style.background = '#064e3b';
          gpuBadge.style.color = '#6ee7b7';
          gpuBadge.textContent = '⚡ GPU enabled (LightGBM + CatBoost)';
        } else {
          gpuBadge.style.background = '#1e2430';
          gpuBadge.style.color = '#64748b';
          gpuBadge.textContent = 'CPU only';
        }
      }).catch(() => { gpuBadge.style.display = 'none'; });

      const resultsHost = document.createElement('div');
      content.appendChild(resultsHost);

      // Restore previous training results if available
      const existingTrainRaw = sessionStorage.getItem('trainingData');
      if (existingTrainRaw) {
        try {
          const td = JSON.parse(existingTrainRaw);
          const modelNames = Object.keys(td.results || {});
          const startLike = {
            task_type: td.task_type,
            feature_columns: td.feature_columns,
            excluded_id_columns: td.excluded_id_columns || [],
            n_train: td.n_train,
            n_test: td.n_test,
            models: modelNames,
          };
          renderSkeleton(resultsHost, startLike);
          modelNames.forEach(name => {
            const r = td.results[name];
            if (r && !r.error) {
              setModelResult({ model: name, metrics: r, elapsed_s: '—' }, startLike);
            } else if (r && r.error) {
              setModelResult({ model: name, error: r.error, elapsed_s: '—' }, startLike);
            }
          });
          if (td.ensemble_results && td.ensemble_results.length) {
            renderEnsembles(resultsHost, td.ensemble_results, startLike);
          }
          if (td.saved_models && td.saved_models.length) {
            renderSaved(resultsHost, td.saved_models);
            renderNextBanner(resultsHost, td);
          }
        } catch (e) {}
      }

      trainBtn.addEventListener('click', async () => {
        trainBtn.disabled = true;
        trainBtn.textContent = 'Training…';
        resultsHost.innerHTML = '';
        let es = null;
        let startData = null;

        function done() {
          if (es) { es.close(); es = null; }
          trainBtn.disabled = false;
          trainBtn.textContent = `Train GradientBoosting, LightGBM & CatBoost (${taskType})`;
        }

        function showError(msg) {
          done();
          if (msg === 'STALE_FILE') {
            resultsHost.innerHTML = `<div id="error-msg" style="padding:20px 0">
              The prepared file is no longer on the server (only the most recent upload is kept).
              <br><a class="download-link" href="/preparation">&larr; Go re-run Data Preparation</a>
            </div>`;
          } else {
            resultsHost.innerHTML += `<div id="error-msg" style="padding:20px 0">${escHtml(msg)}</div>`;
          }
        }

        // Step 1: POST params → get a job_id
        let jobId;
        try {
          const init = await fetch('/train/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prepared_file_id: trainFileId,
              columns: data.columns,
              label,
              label_kind: labelKind,
            }),
          });
          if (!init.ok) {
            const err = await init.json().catch(() => ({}));
            showError(init.status === 404 ? 'STALE_FILE' : (err.detail || `Request failed (${init.status})`));
            return;
          }
          ({ job_id: jobId } = await init.json());
        } catch (e) {
          showError(e.message);
          return;
        }

        // Step 2: open EventSource — browser handles SSE parsing natively
        es = new EventSource(`/train/stream/${jobId}`);

        es.addEventListener('error', (e) => {
          const d = safeJSON(e.data);
          showError(d ? (d.status === 404 ? 'STALE_FILE' : d.detail) : 'Stream error');
        });
        es.addEventListener('start', (e) => {
          startData = safeJSON(e.data);
          if (startData) renderSkeleton(resultsHost, startData);
        });
        es.addEventListener('training', (e) => {
          const d = safeJSON(e.data);
          if (d) setModelStatus(d.model, 'training');
        });
        es.addEventListener('result', (e) => {
          const d = safeJSON(e.data);
          if (d) setModelResult(d, startData);
        });
        es.addEventListener('ensembles', (e) => {
          const d = safeJSON(e.data);
          if (d) renderEnsembles(resultsHost, d.ensemble_results, startData);
        });
        es.addEventListener('saved', (e) => {
          const d = safeJSON(e.data);
          if (d) renderSaved(resultsHost, d.saved_models);
        });
        es.addEventListener('done', (e) => {
          const d = safeJSON(e.data);
          if (d) {
            sessionStorage.setItem('trainingData', JSON.stringify({ ...d, label_kind: labelKind }));
            renderNextBanner(resultsHost, d);
          }
          done();
        });

        // generic EventSource error (network drop etc.)
        es.onerror = () => {
          if (es && es.readyState === EventSource.CLOSED) {
            showError('Connection lost during training.');
          }
        };
      });

      function safeJSON(str) {
        try { return JSON.parse(str); } catch { return null; }
      }
    }

    const MODEL_LABELS = { gradient_boosting: 'GradientBoosting', lightgbm: 'LightGBM', catboost: 'CatBoost' };

    // ── incremental rendering helpers ────────────────────────────────────────

    function metricKeys(taskType) {
      return taskType === 'classification'
        ? [['accuracy','Accuracy'],['f1_weighted','F1 (weighted)']]
        : [['rmse','RMSE'],['mae','MAE'],['r2','R²']];
    }

    function renderSkeleton(host, d) {
      host.innerHTML = '';

      const note = document.createElement('div');
      note.style.cssText = 'color:#64748b;font-size:.8rem;margin-bottom:10px';
      note.textContent = `Trained on ${d.n_train} rows, evaluated on ${d.n_test} rows · task: ${d.task_type} · features: ${d.feature_columns.length}`;
      host.appendChild(note);

      if (d.excluded_id_columns && d.excluded_id_columns.length) {
        const idNote = document.createElement('div');
        idNote.style.cssText = 'color:#64748b;font-size:.78rem;margin-bottom:14px';
        idNote.textContent = `Excluded as identifier column${d.excluded_id_columns.length>1?'s':''}: ${d.excluded_id_columns.join(', ')}`;
        host.appendChild(idNote);
      }

      const keys = metricKeys(d.task_type);
      const table = document.createElement('table');
      table.className = 'model-table';
      table.id = 'model-results-table';
      table.innerHTML = `<thead><tr><th>Model</th><th>Time</th>${keys.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>`;
      const tbody = document.createElement('tbody');
      table.appendChild(tbody);
      d.models.forEach(name => {
        const tr = document.createElement('tr');
        tr.id = `row-${name}`;
        tr.innerHTML = `<td class="model-name">${MODEL_LABELS[name]||name}</td>
          <td id="time-${name}" style="color:#64748b">—</td>
          ${keys.map(([k])=>`<td id="cell-${name}-${k}"><span style="color:#334155">waiting…</span></td>`).join('')}`;
        tbody.appendChild(tr);
      });
      host.appendChild(table);

      // placeholders for ensembles + saved + banner (rendered later)
      const ensHost = document.createElement('div');
      ensHost.id = 'ens-host';
      host.appendChild(ensHost);

      const savedHost = document.createElement('div');
      savedHost.id = 'saved-host';
      host.appendChild(savedHost);

      const bannerHost = document.createElement('div');
      bannerHost.id = 'banner-host';
      host.appendChild(bannerHost);
    }

    function setModelStatus(name, status) {
      const keys = ['accuracy','f1_weighted','rmse','mae','r2'];
      keys.forEach(k => {
        const cell = document.getElementById(`cell-${name}-${k}`);
        if (cell) cell.innerHTML = `<span style="color:#6366f1;animation:pulse 1s infinite">training…</span>`;
      });
    }

    function setModelResult(d, startData) {
      const taskType = startData ? startData.task_type : 'classification';
      const keys = metricKeys(taskType);
      const rankKey = taskType === 'classification' ? 'accuracy' : 'r2';

      const timeCell = document.getElementById(`time-${d.model}`);
      if (timeCell) timeCell.textContent = `${d.elapsed_s}s`;

      if (d.error) {
        keys.forEach(([k]) => {
          const cell = document.getElementById(`cell-${d.model}-${k}`);
          if (cell) cell.innerHTML = `<span class="metric-error">${escHtml(d.error)}</span>`;
        });
        return;
      }

      keys.forEach(([k]) => {
        const cell = document.getElementById(`cell-${d.model}-${k}`);
        if (cell) cell.textContent = d.metrics[k] ?? '—';
      });

      // re-evaluate best row
      const tbody = document.querySelector('#model-results-table tbody');
      if (!tbody) return;
      let bestName = null, bestScore = null;
      document.querySelectorAll('[id^="row-"]').forEach(tr => {
        const name = tr.id.replace('row-','');
        const cell = document.getElementById(`cell-${name}-${rankKey}`);
        if (!cell) return;
        const val = parseFloat(cell.textContent);
        if (!isNaN(val) && (bestScore === null || val > bestScore)) {
          bestScore = val; bestName = name;
        }
      });
      document.querySelectorAll('[id^="row-"]').forEach(tr => {
        const name = tr.id.replace('row-','');
        tr.className = name === bestName ? 'best-row' : '';
        const nameCell = tr.querySelector('.model-name');
        if (nameCell) {
          const badge = name === bestName ? '<span class="best-badge">best</span>' : '';
          nameCell.innerHTML = `${MODEL_LABELS[name]||name}${badge}`;
        }
      });
    }

    function renderEnsembles(host, ensembles, startData) {
      const ensHost = document.getElementById('ens-host');
      if (!ensHost || !ensembles.length) return;
      ensHost.innerHTML = '';
      const taskType = startData ? startData.task_type : 'classification';
      const keys = metricKeys(taskType);
      const rankKey = taskType === 'classification' ? 'accuracy' : 'r2';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Voting ensembles (model combinations)';
      ensHost.appendChild(title);

      let bestEns = null, bestScore = null;
      ensembles.forEach(e => {
        const s = e[rankKey];
        if (s != null && (bestScore === null || s > bestScore)) { bestScore = s; bestEns = e; }
      });

      const t = document.createElement('table');
      t.className = 'model-table';
      t.innerHTML = `<thead><tr><th>Models</th><th>Voting</th>${keys.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>`;
      const tb = document.createElement('tbody');
      ensembles.forEach(e => {
        const tr = document.createElement('tr');
        if (e === bestEns) tr.className = 'best-row';
        const names = e.models.map(n => MODEL_LABELS[n]||n).join(' + ');
        const vl = e.voting === 'soft' ? 'Soft' : e.voting === 'hard' ? 'Hard' : 'Average';
        const badge = e === bestEns ? '<span class="best-badge">best</span>' : '';
        tr.innerHTML = `<td class="model-name">${escHtml(names)}${badge}</td><td>${vl}</td>${keys.map(([k])=>`<td>${e[k]??'—'}</td>`).join('')}`;
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      ensHost.appendChild(t);
    }

    function renderSaved(host, savedModels) {
      const savedHost = document.getElementById('saved-host');
      if (!savedHost || !savedModels.length) return;
      savedHost.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Saved models';
      savedHost.appendChild(title);
      const card = document.createElement('div');
      card.className = 'summary-card';
      savedModels.forEach(s => {
        card.innerHTML += `<div class="summary-row">
          <span>${MODEL_LABELS[s.model]||s.model} (${s.metric}: ${s.score})</span>
          <span style="font-weight:400;color:#64748b">${escHtml(s.filename)}</span>
        </div>`;
      });
      savedHost.appendChild(card);
    }

    function renderNextBanner(host, result) {
      const bannerHost = document.getElementById('banner-host');
      if (!bannerHost || !result.saved_models.length) return;
      bannerHost.innerHTML = '';
      const banner = document.createElement('a');
      banner.className = 'next-banner';
      banner.href = '/inference';
      banner.innerHTML = `
        <span class="next-banner-text">Next: <strong>Inference</strong> — upload test.csv and predict with the best model</span>
        <span class="next-banner-arrow">&rarr;</span>`;
      bannerHost.appendChild(banner);
    }

    // Data Collection resets all progress — confirm before navigating
    document.querySelector('.main-nav a[href="/"]').addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Going to Data Collection will clear all current progress (preparation, training, inference). Continue?')) {
        sessionStorage.clear();
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
