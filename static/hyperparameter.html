<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperparameter Search</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; padding: 0 24px 60px;
      max-width: 1100px; margin: 0 auto;
    }

    .main-nav {
      position: sticky; top: 0; z-index: 60;
      background: #0f1117cc; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e2430;
      display: flex; align-items: center; gap: 0;
      margin: 0 -24px; padding: 0 24px;
    }
    .main-nav a {
      padding: 14px 20px; font-size: .88rem; font-weight: 600;
      color: #64748b; text-decoration: none; white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .main-nav a:hover { color: #cbd5e1; }
    .main-nav a.active { color: #a5b4fc; border-bottom-color: #6366f1; }

    .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-top: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: #64748b; font-size: .85rem; margin-top: 2px; }

    #error-msg { color: #fca5a5; font-size: .95rem; padding: 40px 0; text-align: center; }

    .summary-card {
      background: #111827; border: 1px solid #1e2030; border-radius: 12px;
      padding: 18px 20px; margin-bottom: 24px;
    }
    .summary-card h3 { font-size: .82rem; color: #cbd5e1; margin-bottom: 10px; }
    .summary-row { display: flex; justify-content: space-between; font-size: .8rem; color: #94a3b8; padding: 4px 0; }
    .summary-row span:last-child { color: #e2e8f0; font-weight: 600; }

    .section-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #475569; margin: 36px 0 14px;
      padding-bottom: 8px; border-bottom: 1px solid #1e2430;
    }

    .btn {
      background: #4f46e5; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: .85rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #4338ca; }
    .btn:disabled { background: #2d3748; cursor: not-allowed; }
    .btn-small {
      background: #1e2430; color: #cbd5e1; border: none; border-radius: 6px;
      padding: 4px 10px; font-size: .72rem; font-weight: 600; cursor: pointer;
    }
    .btn-small:hover { background: #2d3748; }

    .model-pick {
      display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
      padding: 10px 0; border-bottom: 1px solid #1e2430;
    }
    .model-pick:last-child { border-bottom: none; }
    .model-pick input { margin-top: 3px; accent-color: #6366f1; flex-shrink: 0; }
    .model-pick-name { font-size: .85rem; font-weight: 600; color: #e2e8f0; }
    .model-pick-meta { font-size: .75rem; color: #64748b; margin-top: 2px; }

    .model-table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 10px; overflow: hidden; border: 1px solid #1e2030; font-size: .78rem; }
    .model-table th, .model-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #1e2430; white-space: nowrap; }
    .model-table th { color: #64748b; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
    .model-table tr:last-child td { border-bottom: none; }
    .model-name { font-weight: 600; color: #e2e8f0; }
    .metric-error { color: #fca5a5; font-size: .74rem; white-space: normal; }
    .note { color: #64748b; font-size: .8rem; margin-bottom: 10px; }
    .table-wrap { overflow-x: auto; }

    .model-section { margin-bottom: 32px; background: #111827; border: 1px solid #1e2030; border-radius: 12px; padding: 18px 20px; }
    .model-section-title { font-size: .95rem; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
    .model-section-meta { font-size: .76rem; color: #64748b; margin-bottom: 14px; }

    .config-row {
      display: grid; grid-template-columns: 20px 1fr; gap: 10px;
      align-items: center; padding: 8px 0; border-bottom: 1px solid #1e2430;
    }
    .config-row:last-child { border-bottom: none; }
    .config-row input[type="checkbox"] { accent-color: #6366f1; }
    .param-name { font-size: .8rem; font-weight: 600; color: #e2e8f0; }
    .param-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
    .param-controls label { font-size: .7rem; color: #64748b; display: flex; align-items: center; gap: 4px; }
    .param-controls input[type="number"] {
      width: 90px; background: #0f1117; color: #e2e8f0; border: 1px solid #2d3748;
      border-radius: 6px; padding: 4px 8px; font-size: .78rem;
    }
    .param-controls input[type="checkbox"] { accent-color: #6366f1; }
    .choice-chip {
      font-size: .72rem; padding: 3px 9px; border-radius: 999px; cursor: pointer;
      background: #1e2430; color: #94a3b8; border: 1px solid #2d3748; user-select: none;
    }
    .choice-chip.on { background: #1e1b4b; color: #a5b4fc; border-color: #4338ca; }

    .n-trials-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .8rem; color: #94a3b8; }
    .n-trials-row input { width: 70px; background: #0f1117; color: #e2e8f0; border: 1px solid #2d3748; border-radius: 6px; padding: 4px 8px; }

    .progress-line { font-size: .8rem; color: #a5b4fc; margin: 10px 0; }
    .progress-bar-track { background: #1e2430; border-radius: 999px; overflow: hidden; height: 8px; margin: 6px 0 12px; }
    .progress-bar-fill { background: #6366f1; height: 100%; border-radius: 999px; transition: width .3s; }

    .plot-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .plot-box { background: #0f1117; border: 1px solid #1e2030; border-radius: 10px; padding: 8px; }

    details.params { margin-top: 10px; }
    details.params summary { cursor: pointer; font-size: .78rem; color: #a5b4fc; }
    .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-top: 8px; }
    @media (max-width: 700px) { .params-grid { grid-template-columns: 1fr; } }
    .param-row-static { display: flex; justify-content: space-between; font-size: .74rem; color: #94a3b8; padding: 2px 0; border-bottom: 1px solid #1e2430; }
    .param-row-static span:last-child { color: #cbd5e1; font-variant-numeric: tabular-nums; }

    .selected-row { background: #0d1f17; }
    .selected-badge { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: #064e3b; color: #6ee7b7; margin-left: 6px; }
    .select-btn { background: #1e2430; color: #cbd5e1; border: none; border-radius: 6px; padding: 4px 10px; font-size: .72rem; font-weight: 600; cursor: pointer; }
    .select-btn:hover { background: #2d3748; }
    .select-btn.is-selected { background: #064e3b; color: #6ee7b7; cursor: default; }
    .inference-pick-card {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: #1e1b4b; border: 1px solid #312e81; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 20px; font-size: .82rem; color: #c7d2fe;
    }
    .inference-pick-card strong { color: #e0e7ff; }
    .inference-pick-card a.btn { margin: 0; white-space: nowrap; text-decoration: none; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <nav class="main-nav">
    <a href="/">Data Collection</a>
    <a href="/analysis">Data Exploration</a>
    <a href="/preparation">Data Preparation</a>
    <a href="/training">Data Training</a>
    <a href="/hyperparameter" class="active">Hyperparameter Search</a>
    <a href="/inference">Inference</a>
  </nav>
  <div id="res-bar" style="
    font-size:.72rem;font-weight:600;color:#64748b;
    display:flex;align-items:center;flex-wrap:wrap;gap:14px;
    padding:6px 0 0;margin-bottom:4px;
  "></div>
  <script>
    (function(){
      const bar = document.getElementById('res-bar');
      function pill(label,pct,color){
        return `<span style="display:inline-flex;align-items:center;gap:6px">
          <span style="color:#94a3b8">${label}</span>
          <span style="background:#1e2430;border-radius:999px;overflow:hidden;width:64px;height:7px;display:inline-block">
            <span style="display:block;height:100%;width:${Math.min(pct,100)}%;background:${color};border-radius:999px;transition:width .4s"></span>
          </span>
          <span style="color:#cbd5e1">${pct}%</span>
        </span>`;
      }
      async function refresh(){
        try{
          const d = await fetch('/resources').then(r=>r.json());
          let html = '';
          html += pill('CPU', d.cpu_pct, '#6366f1');
          if(d.ram && d.ram.total_mb){
            html += pill(`RAM ${d.ram.used_mb}/${d.ram.total_mb} MB`, d.ram.percent, '#0ea5e9');
          }
          bar.innerHTML = html;
        }catch(e){ bar.innerHTML = ''; }
      }
      refresh();
      setInterval(refresh, 5000);
    })();
  </script>

  <div class="top-bar">
    <div>
      <h1>Hyperparameter Search</h1>
      <div class="subtitle">Optuna search on a 10% sample, then one final fit of the best parameters on the full dataset.</div>
    </div>
  </div>

  <div id="content"></div>

  <script>
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function safeJSON(str) { try { return JSON.parse(str); } catch { return null; } }

    const MODEL_LABELS = {
      lr: 'Linear/Logistic Regression', knn: 'KNN', nb: 'Naive Bayes', dt: 'Decision Tree',
      svm: 'SVM', ridge: 'Ridge', rf: 'Random Forest', qda: 'QDA',
      ada: 'AdaBoost', gbc: 'Gradient Boosting', gbr: 'Gradient Boosting', lda: 'LDA', et: 'Extra Trees',
      lightgbm: 'LightGBM', catboost: 'CatBoost', dummy: 'Dummy (baseline)',
      lasso: 'Lasso', en: 'Elastic Net', huber: 'Huber',
    };
    function metricKeysFor(taskType) {
      return taskType === 'categorical'
        ? [['Accuracy','Accuracy'],['AUC','AUC'],['Recall','Recall'],['Prec.','Prec.'],['F1','F1'],['Kappa','Kappa'],['MCC','MCC']]
        : [['MAE','MAE'],['MSE','MSE'],['RMSE','RMSE'],['R2','R2']];
    }

    // Default tunable-parameter schema per model — seeds the config form; the user
    // can toggle params on/off and edit ranges/choices before running the search.
    const DEFAULT_SEARCH_SPACE_CLS = {
      rf: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'min_samples_split', type: 'int', low: 2, high: 20, step: 1, enabled: false },
        { name: 'min_samples_leaf', type: 'int', low: 1, high: 20, step: 1, enabled: false },
        { name: 'max_features', type: 'categorical', choices: ['sqrt', 'log2'], enabled: true },
        { name: 'criterion', type: 'categorical', choices: ['gini', 'entropy'], enabled: false },
      ],
      et: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'min_samples_split', type: 'int', low: 2, high: 20, step: 1, enabled: false },
        { name: 'max_features', type: 'categorical', choices: ['sqrt', 'log2'], enabled: true },
      ],
      gbc: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 10, step: 1, enabled: true },
        { name: 'subsample', type: 'float', low: 0.5, high: 1.0, enabled: false },
      ],
      dt: [
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'min_samples_split', type: 'int', low: 2, high: 20, step: 1, enabled: true },
        { name: 'criterion', type: 'categorical', choices: ['gini', 'entropy'], enabled: false },
      ],
      ada: [
        { name: 'n_estimators', type: 'int', low: 20, high: 300, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.01, high: 2.0, log: true, enabled: true },
      ],
      lr: [
        { name: 'C', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
      ],
      ridge: [
        { name: 'alpha', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
      ],
      knn: [
        { name: 'n_neighbors', type: 'int', low: 1, high: 50, step: 1, enabled: true },
        { name: 'weights', type: 'categorical', choices: ['uniform', 'distance'], enabled: true },
      ],
      lightgbm: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'num_leaves', type: 'int', low: 10, high: 200, step: 1, enabled: true },
        { name: 'max_depth', type: 'int', low: -1, high: 20, step: 1, enabled: false },
        { name: 'min_child_samples', type: 'int', low: 5, high: 100, step: 1, enabled: false },
        { name: 'subsample', type: 'float', low: 0.5, high: 1.0, enabled: false },
        { name: 'colsample_bytree', type: 'float', low: 0.5, high: 1.0, enabled: false },
      ],
      catboost: [
        { name: 'iterations', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'depth', type: 'int', low: 2, high: 10, step: 1, enabled: true },
        { name: 'l2_leaf_reg', type: 'float', low: 1, high: 10, enabled: false },
      ],
      lda: [
        { name: 'solver', type: 'categorical', choices: ['svd', 'lsqr', 'eigen'], enabled: false },
      ],
      nb: [
        { name: 'var_smoothing', type: 'float', low: 1e-12, high: 1e-6, log: true, enabled: false },
      ],
      qda: [
        { name: 'reg_param', type: 'float', low: 0.0, high: 1.0, enabled: false },
      ],
      dummy: [],
    };

    const DEFAULT_SEARCH_SPACE_REG = {
      rf: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'min_samples_split', type: 'int', low: 2, high: 20, step: 1, enabled: false },
        { name: 'max_features', type: 'categorical', choices: ['sqrt', 'log2'], enabled: true },
      ],
      et: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'max_features', type: 'categorical', choices: ['sqrt', 'log2'], enabled: true },
      ],
      gbr: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'max_depth', type: 'int', low: 2, high: 10, step: 1, enabled: true },
        { name: 'subsample', type: 'float', low: 0.5, high: 1.0, enabled: false },
      ],
      dt: [
        { name: 'max_depth', type: 'int', low: 2, high: 30, step: 1, enabled: true },
        { name: 'min_samples_split', type: 'int', low: 2, high: 20, step: 1, enabled: true },
      ],
      ada: [
        { name: 'n_estimators', type: 'int', low: 20, high: 300, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.01, high: 2.0, log: true, enabled: true },
      ],
      lr: [],
      ridge: [
        { name: 'alpha', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
      ],
      lasso: [
        { name: 'alpha', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
      ],
      en: [
        { name: 'alpha', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
        { name: 'l1_ratio', type: 'float', low: 0.0, high: 1.0, enabled: true },
      ],
      huber: [
        { name: 'epsilon', type: 'float', low: 1.0, high: 2.0, enabled: true },
        { name: 'alpha', type: 'float', low: 0.0001, high: 1.0, log: true, enabled: false },
      ],
      knn: [
        { name: 'n_neighbors', type: 'int', low: 1, high: 50, step: 1, enabled: true },
        { name: 'weights', type: 'categorical', choices: ['uniform', 'distance'], enabled: true },
      ],
      svm: [
        { name: 'C', type: 'float', low: 0.001, high: 100, log: true, enabled: true },
        { name: 'epsilon', type: 'float', low: 0.001, high: 1.0, log: true, enabled: false },
      ],
      lightgbm: [
        { name: 'n_estimators', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'num_leaves', type: 'int', low: 10, high: 200, step: 1, enabled: true },
        { name: 'max_depth', type: 'int', low: -1, high: 20, step: 1, enabled: false },
        { name: 'min_child_samples', type: 'int', low: 5, high: 100, step: 1, enabled: false },
        { name: 'subsample', type: 'float', low: 0.5, high: 1.0, enabled: false },
        { name: 'colsample_bytree', type: 'float', low: 0.5, high: 1.0, enabled: false },
      ],
      catboost: [
        { name: 'iterations', type: 'int', low: 50, high: 500, step: 10, enabled: true },
        { name: 'learning_rate', type: 'float', low: 0.001, high: 0.3, log: true, enabled: true },
        { name: 'depth', type: 'int', low: 2, high: 10, step: 1, enabled: true },
        { name: 'l2_leaf_reg', type: 'float', low: 1, high: 10, enabled: false },
      ],
      dummy: [],
    };

    function searchSpaceFor(taskType) {
      return taskType === 'categorical' ? DEFAULT_SEARCH_SPACE_CLS : DEFAULT_SEARCH_SPACE_REG;
    }

    // Experiment log accumulates across every run on this page (not wiped when you
    // tweak the config and train again) so results can be compared and one config
    // chosen for inference later. Persisted so it survives navigating away and back.
    const experimentLog = safeJSON(sessionStorage.getItem('hyperparamExperiments')) || [];
    let selectedExperimentId = (safeJSON(sessionStorage.getItem('selectedInferenceModel')) || {}).experimentId ?? null;
    let nextRunId = (experimentLog.reduce((max, e) => Math.max(max, e.runId), 0) || 0) + 1;
    let nextExperimentId = (experimentLog.reduce((max, e) => Math.max(max, e.experimentId), 0) || 0) + 1;

    function saveExperiments() {
      sessionStorage.setItem('hyperparamExperiments', JSON.stringify(experimentLog));
    }

    function selectExperimentForInference(entry, training, labelKind) {
      selectedExperimentId = entry.experimentId;
      sessionStorage.setItem('selectedInferenceModel', JSON.stringify({
        experimentId: entry.experimentId,
        model: entry.model,
        best_params: entry.best_params,
        best_value: entry.best_value,
        metrics: entry.metrics,
        filename: entry.filename || null,
        label: training.label,
        label_kind: labelKind,
        feature_columns: training.columns.filter(c => c !== training.label),
        clean_file_id: training.clean_file_id,
      }));
    }

    // Data Training's best-performing model (top3[0], already sorted by rank) is
    // always available as a candidate for inference — even before anyone runs a
    // search — so there's always at least one usable configuration to pick. It
    // uses default (untuned) hyperparameters and Data Training's sample-comparison
    // score, since it hasn't been fit on the full dataset.
    function ensureBaselineExperiment(training, labelKind) {
      const already = experimentLog.some(e => e.source === 'baseline' && e.cleanFileId === training.clean_file_id);
      if (already) return;
      const bestModel = training.top3[0];
      const rankKey = labelKind === 'categorical' ? 'Accuracy' : 'R2';
      const metrics = (training.compare_results || {})[bestModel];
      const entry = {
        experimentId: nextExperimentId++,
        runId: 0,
        source: 'baseline',
        cleanFileId: training.clean_file_id,
        model: bestModel,
        n_trials: null,
        search_space: {},
        best_value: metrics && !metrics.error ? (metrics[rankKey] ?? null) : null,
        best_params: {},
        metrics: null,
        error: null,
        filename: training.best_model_filename || null,
        timestamp: new Date().toISOString(),
      };
      experimentLog.unshift(entry);
      saveExperiments();
      if (selectedExperimentId == null) {
        selectExperimentForInference(entry, training, labelKind);
      }
    }

    const content = document.getElementById('content');
    const trainingRaw = sessionStorage.getItem('trainingData');

    if (!trainingRaw) {
      content.innerHTML = `<div id="error-msg">
        No training results found. <a class="download-link" href="/training" style="color:#a5b4fc">Go run Data Training first</a>.
      </div>`;
    } else {
      const training = JSON.parse(trainingRaw);
      if (!training.top3 || !training.top3.length) {
        content.innerHTML = `<div id="error-msg">
          No top-3 models from the last training run. <a class="download-link" href="/training" style="color:#a5b4fc">Go re-run Data Training</a>.
        </div>`;
      } else {
        renderApp(training);
      }
    }

    function renderApp(training) {
      const labelKind = training.label_kind || 'categorical';
      const taskLabel = labelKind === 'categorical' ? 'classification' : 'regression';
      ensureBaselineExperiment(training, labelKind);
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <h3>From Data Training</h3>
        <div class="summary-row"><span>Label</span><span>${escHtml(training.label)} (${taskLabel})</span></div>
        <div class="summary-row"><span>Top 3 models</span><span>${training.top3.map(m => MODEL_LABELS[m]||m).join(', ')}</span></div>`;
      content.appendChild(card);

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Select models to tune';
      content.appendChild(title);

      const pickCard = document.createElement('div');
      pickCard.className = 'summary-card';
      const selected = new Set();

      training.top3.forEach(mid => {
        const metrics = (training.compare_results || {})[mid];
        const label = document.createElement('label');
        label.className = 'model-pick';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = mid;
        cb.addEventListener('change', () => {
          if (cb.checked) selected.add(mid); else selected.delete(mid);
          rebuildConfigSections([...selected]);
          runBtn.disabled = selected.size === 0;
        });
        const txt = document.createElement('div');
        const metaText = metrics && !metrics.error
          ? (labelKind === 'categorical'
              ? `Sample comparison: Accuracy ${metrics.Accuracy ?? '—'}, F1 ${metrics.F1 ?? '—'}`
              : `Sample comparison: R2 ${metrics.R2 ?? '—'}, MAE ${metrics.MAE ?? '—'}`)
          : 'No comparison metrics available';
        txt.innerHTML = `<div class="model-pick-name">${MODEL_LABELS[mid]||mid}</div>
          <div class="model-pick-meta">${escHtml(metaText)}</div>`;
        label.appendChild(cb);
        label.appendChild(txt);
        pickCard.appendChild(label);
      });
      content.appendChild(pickCard);

      const configTitle = document.createElement('div');
      configTitle.className = 'section-title';
      configTitle.textContent = 'Configure search space';
      content.appendChild(configTitle);

      const configHost = document.createElement('div');
      content.appendChild(configHost);

      // model_id -> array of param config objects (mutable copies of the default search space)
      const modelConfigs = {};
      const defaultSpace = searchSpaceFor(labelKind);

      function rebuildConfigSections(modelIds) {
        configHost.innerHTML = '';
        modelIds.forEach(mid => {
          if (!modelConfigs[mid]) {
            modelConfigs[mid] = {
              n_trials: 30,
              params: (defaultSpace[mid] || []).map(p => ({ ...p })),
            };
          }
          configHost.appendChild(buildModelConfigCard(mid, modelConfigs[mid]));
        });
      }

      function buildModelConfigCard(mid, cfg) {
        const card = document.createElement('div');
        card.className = 'model-section';
        card.innerHTML = `<div class="model-section-title">${MODEL_LABELS[mid]||mid}</div>`;

        if (!cfg.params.length) {
          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = 'No tunable hyperparameters for this model.';
          card.appendChild(note);
          return card;
        }

        cfg.params.forEach(p => {
          const row = document.createElement('div');
          row.className = 'config-row';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = p.enabled;
          cb.addEventListener('change', () => { p.enabled = cb.checked; });
          row.appendChild(cb);

          const body = document.createElement('div');
          const nameEl = document.createElement('div');
          nameEl.className = 'param-name';
          nameEl.textContent = p.name;
          body.appendChild(nameEl);

          const controls = document.createElement('div');
          controls.className = 'param-controls';

          if (p.type === 'int' || p.type === 'float') {
            const lowInput = document.createElement('input');
            lowInput.type = 'number';
            lowInput.value = p.low;
            lowInput.step = p.type === 'int' ? '1' : 'any';
            lowInput.addEventListener('input', () => { p.low = Number(lowInput.value); });
            const highInput = document.createElement('input');
            highInput.type = 'number';
            highInput.value = p.high;
            highInput.step = p.type === 'int' ? '1' : 'any';
            highInput.addEventListener('input', () => { p.high = Number(highInput.value); });

            const lowLabel = document.createElement('label');
            lowLabel.textContent = 'low';
            lowLabel.appendChild(lowInput);
            const highLabel = document.createElement('label');
            highLabel.textContent = 'high';
            highLabel.appendChild(highInput);
            controls.appendChild(lowLabel);
            controls.appendChild(highLabel);

            if (p.type === 'int') {
              const stepInput = document.createElement('input');
              stepInput.type = 'number';
              stepInput.value = p.step || 1;
              stepInput.min = '1';
              stepInput.addEventListener('input', () => { p.step = Number(stepInput.value) || 1; });
              const stepLabel = document.createElement('label');
              stepLabel.textContent = 'step';
              stepLabel.appendChild(stepInput);
              controls.appendChild(stepLabel);
            }

            const logLabel = document.createElement('label');
            const logCb = document.createElement('input');
            logCb.type = 'checkbox';
            logCb.checked = !!p.log;
            logCb.addEventListener('change', () => { p.log = logCb.checked; });
            logLabel.appendChild(logCb);
            logLabel.appendChild(document.createTextNode('log scale'));
            controls.appendChild(logLabel);
          } else if (p.type === 'categorical') {
            if (!p._allChoices) p._allChoices = [...p.choices];
            p._allChoices.forEach(choice => {
              const chip = document.createElement('span');
              chip.className = 'choice-chip' + (p.choices.includes(choice) ? ' on' : '');
              chip.textContent = choice === null ? 'None' : String(choice);
              chip.addEventListener('click', () => {
                const idx = p.choices.indexOf(choice);
                if (idx >= 0) {
                  if (p.choices.length > 1) p.choices.splice(idx, 1);
                } else {
                  p.choices.push(choice);
                }
                chip.classList.toggle('on', p.choices.includes(choice));
              });
              controls.appendChild(chip);
            });
          }

          body.appendChild(controls);
          row.appendChild(body);
          card.appendChild(row);
        });

        const trialsRow = document.createElement('div');
        trialsRow.className = 'n-trials-row';
        const trialsInput = document.createElement('input');
        trialsInput.type = 'number';
        trialsInput.min = '2';
        trialsInput.value = cfg.n_trials;
        trialsInput.addEventListener('input', () => { cfg.n_trials = Math.max(2, Number(trialsInput.value) || 30); });
        trialsRow.appendChild(document.createTextNode('Trials:'));
        trialsRow.appendChild(trialsInput);
        card.appendChild(trialsRow);

        return card;
      }

      const runTitle = document.createElement('div');
      runTitle.className = 'section-title';
      runTitle.textContent = 'Train';
      content.appendChild(runTitle);

      const runBtn = document.createElement('button');
      runBtn.className = 'btn';
      runBtn.textContent = 'Run hyperparameter search';
      runBtn.disabled = true;
      content.appendChild(runBtn);

      const resultsHost = document.createElement('div');
      content.appendChild(resultsHost);

      const experimentsTitle = document.createElement('div');
      experimentsTitle.className = 'section-title';
      experimentsTitle.textContent = 'Experiment log';
      content.appendChild(experimentsTitle);

      const experimentsHost = document.createElement('div');
      content.appendChild(experimentsHost);
      renderExperimentsTable(experimentsHost, training, labelKind);

      runBtn.addEventListener('click', () => {
        const payload = [...selected].map(mid => {
          const cfg = modelConfigs[mid];
          const search_space = {};
          cfg.params.forEach(p => {
            if (!p.enabled) return;
            if (p.type === 'categorical') {
              search_space[p.name] = { type: 'categorical', choices: p.choices };
            } else {
              search_space[p.name] = { type: p.type, low: p.low, high: p.high, log: !!p.log };
              if (p.type === 'int') search_space[p.name].step = p.step || 1;
            }
          });
          return { model_id: mid, n_trials: cfg.n_trials, search_space };
        });
        const runId = nextRunId++;
        runTune(training, labelKind, payload, runBtn, resultsHost, runId, (entry) => {
          experimentLog.push(entry);
          saveExperiments();
          renderExperimentsTable(experimentsHost, training, labelKind);
        }, (savedModels) => {
          savedModels.forEach(s => {
            const entry = experimentLog.find(e => e.runId === runId && e.model === s.model);
            if (entry) {
              entry.filename = s.filename;
              // keep the persisted selection's filename fresh if this run's model is the current pick
              if (entry.experimentId === selectedExperimentId) selectExperimentForInference(entry, training, labelKind);
            }
          });
          saveExperiments();
          renderExperimentsTable(experimentsHost, training, labelKind);
        });
      });
    }

    function runTune(training, labelKind, models, runBtn, resultsHost, runId, onExperimentRecorded, onModelsSaved) {
      runBtn.disabled = true;
      runBtn.textContent = 'Running…';
      resultsHost.innerHTML = '';
      let es = null;
      const modelsById = Object.fromEntries(models.map(m => [m.model_id, m]));
      const pendingSearch = {}; // model_id -> { best_value, best_params } from search_done, merged in at full_refit_result

      function done() {
        if (es) { es.close(); es = null; }
        runBtn.disabled = false;
        runBtn.textContent = 'Run hyperparameter search';
      }
      function showError(msg) {
        done();
        resultsHost.innerHTML += `<div id="error-msg" style="padding:20px 0">${escHtml(msg)}</div>`;
      }

      (async () => {
        let jobId;
        try {
          const init = await fetch('/tune/init', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              clean_file_id: training.clean_file_id,
              columns: training.columns,
              label: training.label,
              label_kind: labelKind,
              models,
              sample_frac: 0.1,
              fold: 5,
            }),
          });
          if (!init.ok) {
            const err = await init.json().catch(() => ({}));
            showError(err.detail || `Request failed (${init.status})`);
            return;
          }
          ({ job_id: jobId } = await init.json());
        } catch (e) {
          showError(e.message);
          return;
        }

        es = new EventSource(`/tune/stream/${jobId}`);

        es.addEventListener('error', (e) => {
          const d = safeJSON(e.data);
          showError(d ? d.detail : 'Stream error');
        });
        es.addEventListener('sample_ready', (e) => {
          const d = safeJSON(e.data);
          if (d) renderSampleNote(resultsHost, d, labelKind);
        });
        es.addEventListener('search_start', (e) => {
          const d = safeJSON(e.data);
          if (d) renderSearchStart(resultsHost, d);
        });
        es.addEventListener('trial_result', (e) => {
          const d = safeJSON(e.data);
          if (d) renderTrialProgress(d, labelKind);
        });
        es.addEventListener('search_done', (e) => {
          const d = safeJSON(e.data);
          if (d) {
            renderSearchDone(d, labelKind);
            if (!d.error) pendingSearch[d.model] = { best_value: d.best_value, best_params: d.best_params };
          }
        });
        es.addEventListener('full_setup', (e) => {
          const d = safeJSON(e.data);
          if (d) renderFullSetupNote(resultsHost, d, labelKind);
        });
        es.addEventListener('fit_progress', (e) => {
          const d = safeJSON(e.data);
          if (d) renderFitProgressNote(resultsHost, d);
        });
        es.addEventListener('full_refit_result', (e) => {
          const d = safeJSON(e.data);
          if (d) {
            renderFullRefitResult(d.model, d, labelKind);
            const search = pendingSearch[d.model];
            const cfg = modelsById[d.model];
            onExperimentRecorded({
              experimentId: nextExperimentId++,
              runId,
              model: d.model,
              n_trials: cfg ? cfg.n_trials : null,
              search_space: cfg ? cfg.search_space : {},
              best_value: search ? search.best_value : null,
              best_params: search ? search.best_params : null,
              metrics: d.error ? null : d.metrics,
              error: d.error || null,
              timestamp: new Date().toISOString(),
            });
          }
        });
        es.addEventListener('saved', (e) => {
          const d = safeJSON(e.data);
          if (d) {
            renderSaved(resultsHost, d.saved_models);
            onModelsSaved(d.saved_models);
          }
        });
        es.addEventListener('done', () => done());
        es.onerror = () => {
          if (es && es.readyState === EventSource.CLOSED) {
            showError('Connection lost during the hyperparameter search.');
          }
        };
      })();
    }

    function renderSampleNote(host, d, labelKind) {
      const note = document.createElement('div');
      note.className = 'note';
      const sampling = labelKind === 'categorical' ? 'stratified sample' : 'random sample';
      note.textContent = `Searching on ${d.n_sample.toLocaleString()} rows (${Math.round(d.sample_frac*100)}% ${sampling} of ${d.n_total.toLocaleString()} total rows)…`;
      host.appendChild(note);
    }

    function modelResultSection(host, mid) {
      let sec = document.getElementById(`result-sec-${mid}`);
      if (!sec) {
        sec = document.createElement('div');
        sec.id = `result-sec-${mid}`;
        sec.className = 'model-section';
        sec.innerHTML = `<div class="model-section-title">${MODEL_LABELS[mid]||mid}</div>`;
        host.appendChild(sec);
      }
      return sec;
    }

    function renderSearchStart(host, d) {
      const sec = modelResultSection(host, d.model);
      const line = document.createElement('div');
      line.id = `progress-${d.model}`;
      line.className = 'progress-line';
      line.textContent = `Trial 0/${d.n_trials}…`;
      sec.appendChild(line);
      const track = document.createElement('div');
      track.className = 'progress-bar-track';
      track.id = `progress-track-${d.model}`;
      track.innerHTML = `<div class="progress-bar-fill" id="progress-fill-${d.model}" style="width:0%"></div>`;
      sec.appendChild(track);
    }

    function renderTrialProgress(d, labelKind) {
      const scoreLabel = labelKind === 'categorical' ? 'accuracy' : 'R2';
      const line = document.getElementById(`progress-${d.model}`);
      if (line) {
        line.textContent = `Trial ${d.trial + 1}/${d.n_trials} — best ${scoreLabel} so far: ${d.best_value}`;
      }
      const fill = document.getElementById(`progress-fill-${d.model}`);
      if (fill) fill.style.width = `${Math.round(((d.trial + 1) / d.n_trials) * 100)}%`;
    }

    function renderSearchDone(d, labelKind) {
      const scoreLabel = labelKind === 'categorical' ? 'accuracy' : 'R2';
      const sec = document.getElementById(`result-sec-${d.model}`);
      if (!sec) return;
      if (d.error) {
        const err = document.createElement('div');
        err.className = 'metric-error';
        err.textContent = d.error;
        sec.appendChild(err);
        return;
      }
      const summary = document.createElement('div');
      summary.className = 'note';
      summary.textContent = `Best sample ${scoreLabel}: ${d.best_value} (search took ${d.elapsed_s}s)`;
      sec.appendChild(summary);

      const details = document.createElement('details');
      details.className = 'params';
      const rows = Object.entries(d.best_params)
        .map(([k, v]) => `<div class="param-row-static"><span>${escHtml(k)}</span><span>${escHtml(String(v))}</span></div>`)
        .join('');
      details.innerHTML = `<summary>Best hyperparameters found</summary><div class="params-grid">${rows}</div>`;
      sec.appendChild(details);

      if (window.Plotly && (d.history_json || d.slice_json)) {
        const grid = document.createElement('div');
        grid.className = 'plot-grid';
        if (d.history_json) {
          const box = document.createElement('div');
          box.className = 'plot-box';
          grid.appendChild(box);
          const fig = JSON.parse(d.history_json);
          applyDarkTheme(fig.layout);
          Plotly.newPlot(box, fig.data, fig.layout, { responsive: true, displayModeBar: false });
        }
        if (d.slice_json) {
          const box = document.createElement('div');
          box.className = 'plot-box';
          grid.appendChild(box);
          const fig = JSON.parse(d.slice_json);
          applyDarkTheme(fig.layout);
          Plotly.newPlot(box, fig.data, fig.layout, { responsive: true, displayModeBar: false });
        }
        sec.appendChild(grid);
      }
    }

    function applyDarkTheme(layout) {
      layout.paper_bgcolor = '#0f1117';
      layout.plot_bgcolor = '#0f1117';
      layout.font = { color: '#94a3b8', size: 10 };
      layout.margin = { t: 30, l: 40, r: 20, b: 30 };
    }

    // Real iteration counts for LightGBM/CatBoost, an elapsed-time heartbeat for
    // everything else (no generic incremental-fit hook for most sklearn models).
    function fitProgressText(d) {
      const label = MODEL_LABELS[d.model] || d.model;
      if (d.total) {
        const pct = Math.round((d.iteration / d.total) * 100);
        return `Fitting ${label}: iteration ${d.iteration}/${d.total} (${pct}%) — ${d.elapsed_s}s elapsed…`;
      }
      return `Fitting ${label}: still working — ${d.elapsed_s}s elapsed…`;
    }

    function renderFitProgressNote(host, d) {
      let note = document.getElementById('fit-progress-note');
      if (!note) {
        note = document.createElement('div');
        note.id = 'fit-progress-note';
        note.className = 'note';
        note.style.color = '#a5b4fc';
        host.appendChild(note);
      }
      note.textContent = fitProgressText(d);
    }

    function renderFullSetupNote(host, d, labelKind) {
      const keys = metricKeysFor(labelKind);
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Final fit — best hyperparameters on full dataset';
      host.appendChild(title);
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = `Trained on ${d.n_train.toLocaleString()} rows, evaluated on ${d.n_test.toLocaleString()} held-out rows.`;
      host.appendChild(note);
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.id = 'refit-wrap';
      wrap.dataset.labelKind = labelKind;
      const table = document.createElement('table');
      table.className = 'model-table';
      table.innerHTML = `<thead><tr><th>Model</th><th>Time</th>${keys.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead>`;
      table.appendChild(document.createElement('tbody'));
      wrap.appendChild(table);
      host.appendChild(wrap);
    }

    function renderFullRefitResult(mid, d, labelKind) {
      const wrap = document.getElementById('refit-wrap');
      if (!wrap) return;
      const keys = metricKeysFor(labelKind);
      const tbody = wrap.querySelector('tbody');
      const tr = document.createElement('tr');
      if (d.error) {
        tr.innerHTML = `<td class="model-name">${MODEL_LABELS[mid]||mid}</td><td>${d.elapsed_s}s</td>
          <td colspan="${keys.length}" class="metric-error">${escHtml(d.error)}</td>`;
      } else {
        tr.innerHTML = `<td class="model-name">${MODEL_LABELS[mid]||mid}</td><td>${d.elapsed_s}s</td>
          ${keys.map(([k]) => `<td>${d.metrics[k] ?? '—'}</td>`).join('')}`;
      }
      tbody.appendChild(tr);
    }

    function renderSaved(host, savedModels) {
      if (!savedModels || !savedModels.length) return;
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Saved models';
      host.appendChild(title);
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `<div class="note" style="margin-bottom:12px">
        Saved to <code>models/</code> on the server using this environment's own scikit-learn/LightGBM/CatBoost
        versions — not wired into the Inference page yet, kept here for the record.
      </div>`;
      savedModels.forEach(s => {
        card.innerHTML += `<div class="summary-row">
          <span>${MODEL_LABELS[s.model]||s.model}</span>
          <span style="font-weight:400;color:#64748b">${escHtml(s.filename)}</span>
        </div>`;
      });
      host.appendChild(card);
    }

    function renderExperimentsTable(host, training, labelKind) {
      host.innerHTML = '';
      if (!experimentLog.length) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = 'No experiments yet — run a search above. Every run you try (with whatever config and models) gets logged here so you can compare them.';
        host.appendChild(note);
        return;
      }

      if (selectedExperimentId != null) {
        const chosen = experimentLog.find(e => e.experimentId === selectedExperimentId);
        if (chosen) {
          const runLabel = chosen.source === 'baseline' ? 'baseline — best from Data Training' : `run #${chosen.runId}`;
          const pick = document.createElement('div');
          pick.className = 'inference-pick-card';
          pick.innerHTML = `
            <span>Selected for inference: <strong>${MODEL_LABELS[chosen.model]||chosen.model}</strong> (${runLabel})</span>
            <a class="btn" href="/inference">Go to Inference &rarr;</a>`;
          host.appendChild(pick);
        }
      }

      const rankKey = labelKind === 'categorical' ? 'Accuracy' : 'R2';
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      table.className = 'model-table';
      table.innerHTML = `<thead><tr>
        <th>Run</th><th>Model</th><th>Trials</th><th>Best (sample)</th><th>Full dataset ${rankKey}</th><th>Details</th><th>Inference</th>
      </tr></thead>`;
      const tbody = document.createElement('tbody');

      [...experimentLog].reverse().forEach(entry => {
        const tr = document.createElement('tr');
        tr.className = entry.experimentId === selectedExperimentId ? 'selected-row' : '';

        const bestSample = entry.best_value != null ? entry.best_value : '—';
        const fullScore = entry.metrics ? (entry.metrics[rankKey] ?? '—') : '—';

        const detailsCell = document.createElement('td');
        if (entry.error) {
          detailsCell.innerHTML = `<span class="metric-error">${escHtml(entry.error)}</span>`;
        } else if (entry.best_params && Object.keys(entry.best_params).length) {
          const details = document.createElement('details');
          details.className = 'params';
          const rows = Object.entries(entry.best_params)
            .map(([k, v]) => `<div class="param-row-static"><span>${escHtml(k)}</span><span>${escHtml(String(v))}</span></div>`)
            .join('');
          details.innerHTML = `<summary>Params</summary><div class="params-grid">${rows}</div>`;
          detailsCell.appendChild(details);
        } else {
          detailsCell.innerHTML = `<span class="note" style="margin:0">Default (not tuned)</span>`;
        }

        const actionCell = document.createElement('td');
        if (entry.error) {
          actionCell.textContent = '—';
        } else if (entry.experimentId === selectedExperimentId) {
          actionCell.innerHTML = `<button class="select-btn is-selected" disabled>Selected</button>`;
        } else {
          const btn = document.createElement('button');
          btn.className = 'select-btn';
          btn.textContent = 'Use for inference';
          btn.addEventListener('click', () => {
            selectExperimentForInference(entry, training, labelKind);
            renderExperimentsTable(host, training, labelKind);
          });
          actionCell.appendChild(btn);
        }

        const runLabel = entry.source === 'baseline' ? 'Baseline' : `#${entry.runId}`;
        tr.innerHTML = `<td>${runLabel}</td>
          <td class="model-name">${MODEL_LABELS[entry.model]||entry.model}</td>
          <td>${entry.n_trials ?? '—'}</td>
          <td>${bestSample}</td>
          <td>${fullScore}</td>`;
        tr.appendChild(detailsCell);
        tr.appendChild(actionCell);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      wrap.appendChild(table);
      host.appendChild(wrap);
    }

    // Data Collection resets all progress — confirm before navigating
    document.querySelector('.main-nav a[href="/"]').addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Going to Data Collection will clear all current progress (preparation, training, inference). Continue?')) {
        sessionStorage.clear();
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
